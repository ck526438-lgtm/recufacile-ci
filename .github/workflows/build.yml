name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secrets de signature absents : APK signé avec une clé de debug temporaire (les mises à jour ne s'installeront pas par-dessus)."
            exit 0
          fi
          # Tolère les erreurs de copier-coller : « NOM=valeur », espaces, retours à la ligne.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[A-Z_]+=//; s/^[[:space:]]+//; s/[[:space:]]+$//'; }
          STORE_PASS=$(clean "$KEYSTORE_PASSWORD")
          KEY_PASS=$(clean "$KEY_PASSWORD")
          ALIAS=$(clean "$KEY_ALIAS")
          [ -z "$ALIAS" ] && ALIAS=recufacile
          [ -z "$KEY_PASS" ] && KEY_PASS="$STORE_PASS"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | sed -E 's/^[[:space:]]*KEYSTORE_BASE64=//' | tr -d ' \r\n\t' | base64 -d > android/app/upload.jks || {
            echo "::error::KEYSTORE_BASE64 n'est pas un base64 valide : recopiez tout le contenu de KEYSTORE_BASE64.txt."; exit 1; }
          # Essaie toutes les combinaisons (secrets inversés entre eux, alias par défaut).
          OK=""
          for P in "$STORE_PASS" "$KEY_PASS" "$ALIAS"; do
            for A in "$ALIAS" recufacile; do
              if [ -n "$P" ] && keytool -list -keystore android/app/upload.jks -storepass "$P" -alias "$A" >/dev/null 2>&1; then
                STORE_PASS="$P"; KEY_PASS="$P"; ALIAS="$A"; OK=1; break 2
              fi
            done
          done
          if [ -z "$OK" ]; then
            echo "::error::Clé de signature illisible : le mot de passe ne correspond pas. Recopiez dans KEYSTORE_PASSWORD et KEY_PASSWORD uniquement la valeur après le signe = dans autres-secrets.txt."
            exit 1
          fi
          echo "✓ Clé de signature valide (alias $ALIAS)"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' "$STORE_PASS" "$KEY_PASS" "$ALIAS" > android/key.properties

      - name: Générer les plateformes natives
        run: bash tool/setup_platforms.sh

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter test

      - name: Construire l'APK et l'AAB (Play Store)
        run: |
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk RecuFacile-CI.apk
          cp build/app/outputs/bundle/release/app-release.aab RecuFacile-CI.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RecuFacile-CI
          path: |
            RecuFacile-CI.apk
            RecuFacile-CI.aab

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RecuFacile-CI.apk
            RecuFacile-CI.aab
