name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Générer les plateformes natives
        run: bash tool/setup_platforms.sh

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Renommer
        run: cp build/app/outputs/flutter-apk/app-release.apk ReçuFacile-CI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReçuFacile-CI-apk
          path: ReçuFacile-CI.apk

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReçuFacile-CI.apk
