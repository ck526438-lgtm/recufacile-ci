name: 🐞 Signaler un problème
description: Quelque chose ne marche pas dans l'application
labels: [bug]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Que s'est-il passé ?
      placeholder: Ex. Le PDF ne s'ouvre pas quand je partage sur WhatsApp
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment reproduire le problème ?
      placeholder: "1. J'ouvre un reçu\n2. Je touche Partager\n3. ..."
  - type: input
    id: telephone
    attributes:
      label: Téléphone et version d'Android
      placeholder: Ex. Tecno Spark 10, Android 13
  - type: input
    id: version
    attributes:
      label: Version de ReçuFacile CI
      description: Visible dans Ma boutique (en bas) ou Aide & avis
      placeholder: Ex. 1.1.0
