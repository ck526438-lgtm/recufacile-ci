name: 💡 Proposer une idée
description: Une fonction qui vous aiderait dans votre commerce
labels: [suggestion]
body:
  - type: textarea
    id: idee
    attributes:
      label: Votre idée
      placeholder: Ex. Pouvoir noter les clients qui paient à crédit
    validations:
      required: true
  - type: input
    id: activite
    attributes:
      label: Votre activité
      placeholder: Ex. Boutique de téléphones, salon de coiffure, maquis…
